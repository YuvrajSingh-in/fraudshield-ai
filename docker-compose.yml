services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  fraud-api:
    build: .
    container_name: fraud-api
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-changeme}
    command: uvicorn fraud_api:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  fraud-consumer:
    build: .
    container_name: fraud-consumer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: python -m src.streaming.kafka_consumer
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs

  fraud-producer:
    build: .
    container_name: fraud-producer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: python -m src.streaming.kafka_producer

  dashboard:
    build: .
    container_name: fraud-dashboard
    restart: unless-stopped
    depends_on:
      - fraud-consumer
    ports:
      - "8501:8501"
    command: streamlit run dashboard_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    volumes:
      - ./logs:/app/logs:ro
